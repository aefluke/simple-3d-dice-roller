<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dice Roller</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Floating result labels (positioned in JS) -->
  <div id="labels"></div>

  <!-- Left panel -->
  <div id="panel">
    <div class="panel-header">
      <div class="panel-title">Dice Roller</div>
      <button id="clearDiceBtn" title="Clear all dice" disabled>✕</button>
    </div>

    <div class="die-list">
      <div class="die-row">
        <span class="die-name">D4</span>
        <div class="die-controls">
          <button class="remove-btn" data-type="d4" disabled>−</button>
          <span class="die-count" data-type="d4">0</span>
          <button class="add-btn" data-type="d4">+</button>
        </div>
      </div>

      <div class="die-row">
        <span class="die-name">D6</span>
        <div class="die-controls">
          <button class="remove-btn" data-type="d6" disabled>−</button>
          <span class="die-count" data-type="d6">0</span>
          <button class="add-btn" data-type="d6">+</button>
        </div>
      </div>

      <div class="die-row">
        <span class="die-name">D8</span>
        <div class="die-controls">
          <button class="remove-btn" data-type="d8" disabled>−</button>
          <span class="die-count" data-type="d8">0</span>
          <button class="add-btn" data-type="d8">+</button>
        </div>
      </div>

      <div class="die-row">
        <span class="die-name">D10</span>
        <div class="die-controls">
          <button class="remove-btn" data-type="d10" disabled>−</button>
          <span class="die-count" data-type="d10">0</span>
          <button class="add-btn" data-type="d10">+</button>
        </div>
      </div>

      <div class="die-row">
        <span class="die-name">D20</span>
        <div class="die-controls">
          <button class="remove-btn" data-type="d20" disabled>−</button>
          <span class="die-count" data-type="d20">0</span>
          <button class="add-btn" data-type="d20">+</button>
        </div>
      </div>
    </div>

    <button id="rollBtn" disabled>Roll</button>
  </div>

  <!-- Right log panel -->
  <div id="log-panel">
    <div class="log-panel-header">
      <span class="panel-title">Roll Log</span>
      <button id="clearLogBtn" title="Clear log">✕</button>
    </div>
    <div id="log-entries"></div>
    <div id="log-empty">No rolls yet</div>
  </div>

  <!-- Mobile bottom bar (hidden on desktop) -->
  <div id="mobile-bar">
    <button id="diceToggleBtn" aria-label="Dice selection">🎲</button>
    <button id="rollBtnMobile" disabled>ROLL</button>
    <button id="logToggleBtn" aria-label="Roll log">☰</button>
  </div>
  <!-- Overlay — drawer dışına basınca kapatır -->
  <div id="mobile-overlay"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
